<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>ひとことフブキ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --font-main: 'Noto Sans JP', sans-serif;
  --font-classic: 'Klee One', serif;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  font-family: var(--font-main);
  color: #333;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 80px; 
  box-sizing: border-box;
  
  background-attachment: fixed;
  background-size: cover;
  transition: background 1s ease;
  position: relative;
}

body.bg-morning  { background: linear-gradient(135deg, #FFDAB9 0%, #89CFF0 100%); }
body.bg-noon1    { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
body.bg-noon2    { background: linear-gradient(135deg, #2980b9 0%, #6dd5fa 100%); }
body.bg-evening  { background: linear-gradient(135deg, #0b1a3d 0%, #4b1c5a 40%, #ff7e5f 100%); }
body.bg-night    { background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); }
body.bg-midnight { background: linear-gradient(135deg, #141e30 0%, #243b55 100%); }

.star-field {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 1s ease;
}

body.bg-night .star-field, body.bg-midnight .star-field { opacity: 1; }

.star-field::before, .star-field::after {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: 
    radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
    radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
    radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
  background-size: 550px 550px, 350px 350px, 250px 250px;
  background-position: 0 0, 40px 60px, 130px 270px;
}

body.bg-midnight .star-field::after {
  background-image: 
    radial-gradient(white, rgba(255,255,255,.25) 2px, transparent 3px),
    radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 2px);
  background-size: 300px 300px, 200px 200px;
  background-position: 150px 150px, 70px 110px;
}

.menu, .reminder-menu, .debug-toggle-container, .debug-menu {
  -webkit-transform: translate3d(0, 0, 0);
  transform: translate3d(0, 0, 0);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.menu {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 10;
  display: flex;
  gap: 8px;
}

.reminder-menu {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 10;
}

.menu button, .reminder-menu button {
  padding: 8px 14px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
  color: #333;
  font-family: var(--font-classic);
  font-weight: 600;
  font-size: 15px;
}
.menu button:hover, .reminder-menu button:hover {
  background: rgba(255, 255, 255, 0.8);
}

.log {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);

  width: 300px;
  max-height: 400px;
  overflow-y: auto;

  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 15px;
  font-size: 12px;
  color: #333;

  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  opacity: 0;
  transition: all 0.5s ease;
  z-index: 100;
}

.log-title {
  font-family: var(--font-classic);
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 10px;
  color: #2a6fff;
}

.log.show {
  display: block;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  animation: popup 0.25s ease;
}

@keyframes popup {
  0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
  60% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); }
}

.app-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 60px;
  transition: 0.3s;
  z-index: 2;
}

.container {
  position: relative;
  width: 320px;
  padding: 15px;
  border-radius: 16px;
  
  border: 1px solid rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  transition: all 0.5s ease;

  text-align: center;
}

body.affinity-lv3 .log, body.affinity-lv3 .container, body.affinity-lv3 .reminder-display {
  border-color: rgba(100, 200, 255, 0.8);
  box-shadow: 0 0 15px rgba(100, 200, 255, 0.5);
}

body.affinity-max .log, body.affinity-max .container, body.affinity-max .reminder-display {
  border-color: rgba(220, 230, 240, 0.9);
  box-shadow: 0 0 25px rgba(220, 230, 240, 0.7);
}

.title {
  font-family: var(--font-classic);
  font-size: 22px;
  margin-bottom: 8px;
  letter-spacing: 2px;
  font-weight: 600;
  transition: color 1s ease, text-shadow 1s ease;
}

body.bg-morning .title, body.bg-noon1 .title {
  color: #333;
  text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 5px rgba(255,255,255,0.8);
}

body.bg-noon2 .title, body.bg-evening .title, body.bg-night .title, body.bg-midnight .title {
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5), 0 0 10px rgba(0,0,0,0.3);
}
  
.character {
  width: 260px;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
}

.speech {
  position: absolute;
  bottom: -35px;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  padding: 12px;

  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  font-family: var(--font-main);
  font-size: 14px;
  text-align: left;
  min-height: 45px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  color: #333;
}

.speech::after {
  content: "▼";
  position: absolute;
  right: 10px;
  bottom: 5px;
  font-size: 12px;
  color: #7fbce0;
}

.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  opacity: 0;
  pointer-events: none;
  transition: 0.2s;
  z-index: 50;
  display: none;
}

.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.closeBtn {
  position: absolute;
  top: 8px;
  right: 10px;
  background: none;
  border: none;
  font-size: 18px;
  color: #7fbce0;
  cursor: pointer;
  transition: 0.2s;
}

.closeBtn:hover {
  color: #2a6fff;
  transform: scale(1.2);
}

.debug-toggle-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 10;
  font-size: 15px;
  color: #fff;
  font-family: var(--font-classic);
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

.switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 20px;
}

.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
  background-color: #ccc; transition: .4s; border-radius: 20px;
}
.slider:before {
  position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
  background-color: white; transition: .4s; border-radius: 50%;
}
input:checked + .slider { background-color: #2a6fff; }
input:checked + .slider:before { transform: translateX(20px); }

.debug-menu {
  position: fixed; bottom: 50px; right: 20px;
  background: rgba(255, 255, 255, 0.85); 
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 8px; padding: 10px; display: flex; flex-direction: column;
  z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  font-family: var(--font-main);
}
.debug-menu select { padding: 4px; border: 1px solid #7fbce0; border-radius: 4px; color: #333; }
.debug-menu button {
  padding: 4px 8px; border: 1px solid #ff7b7b; background: #fff0f0;
  color: #d93030; border-radius: 4px; cursor: pointer; font-size: 12px;
}
.debug-menu button:hover { background: #ffd6d6; }

.bd-select { padding: 4px; border: 1px solid #7fbce0; border-radius: 4px; font-size: 14px; }

.reminder-display {
  width: 320px;
  padding: 12px 16px;
  box-sizing: border-box;
  border-radius: 12px;
  
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-left: 6px solid #ff7b7b;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  text-align: left;
  position: relative;
  touch-action: none;
  user-select: none;
  cursor: grab;
  color: #333;
  transition: all 0.5s ease;
}

.reminder-display:active { cursor: grabbing; }

.rem-long-pressed {
  background: #fff0f0;
  border-color: #ff7b7b;
}

.rem-title {
  font-family: var(--font-classic);
  font-size: 18px; font-weight: 600; color: #d93030; margin-bottom: 4px; 
}
.rem-time { font-family: var(--font-main); font-size: 12px; color: #666; }
.rem-count { font-family: var(--font-main); position: absolute; top: 12px; right: 16px; font-size: 12px; color: #ff7b7b; }
.rem-hint { font-family: var(--font-main); font-size: 10px; color: #aaa; margin-top: 8px; text-align: right; }

.rem-input {
  padding: 8px;
  border: 1px solid #7fbce0;
  border-radius: 4px;
  font-size: 14px;
  width: 80%;
  box-sizing: border-box;
  font-family: var(--font-main);
}
</style>
</head>

<body>

<div class="star-field"></div>
<div id="overlay" class="overlay"></div>

<div class="menu">
  <button onclick="toggleLog()">セリフ一覧</button>
  <button id="editBirthdayBtn" onclick="openBirthdayModal()" style="display: none;">誕生日設定</button>
  <button id="musicRoomBtn" onclick="openMusicRoomModal()" style="display: none;">音楽室</button>
</div>

<div class="reminder-menu">
  <button onclick="openReminderCreateModal()">リマインダーを作成</button>
</div>

<div class="debug-toggle-container">
  <span>デバッグモード</span>
  <label class="switch">
    <input type="checkbox" id="debugToggle" onchange="handleDebugToggle(this)">
    <span class="slider"></span>
  </label>
</div>
<div class="debug-menu" id="debugMenu" style="display: none;">
  <label style="font-size: 12px; color: #2a6fff;">セリフ指定:</label>
  <select id="debugCondition" onchange="updateBackground()">
    <option value="all">全ランダム</option>
    <option value="morning">朝</option>
    <option value="noon1">昼1</option>
    <option value="noon2">昼2</option>
    <option value="evening">夕方</option>
    <option value="night">夜</option>
    <option value="midnight">深夜</option>
    <option value="seasonal">季節</option>
    <option value="rare_normal">レア(通常)</option>
    <option value="rare_midnight">レア(深夜)</option>
  </select>
  <button onclick="resetNormalHistory()" style="margin-top: 8px;">通常履歴リセット</button>
</div>

<div id="log" class="log">
  <button class="closeBtn" onclick="toggleLog()">×</button>
  <div id="logContent">
    <div class="log-title">セリフ図鑑</div>
    <div id="logList"></div>
  </div>
</div>

<div id="passwordModal" class="log">
  <button class="closeBtn" onclick="closePasswordModal()">×</button>
  <div style="text-align: center; margin-top: 20px;">
    パスワードを入力してください<br>
    <input type="password" id="debugPassword" style="margin: 15px 0; padding: 5px; width: 80%; border: 1px solid #7fbce0; border-radius: 4px;"><br>
    <button onclick="checkPassword()" style="padding: 5px 15px; border: 1px solid #7fbce0; background: rgba(255,255,255,0.5); border-radius: 4px; cursor: pointer;">認証</button>
  </div>
</div>

<div id="birthdayModal" class="log">
  <button class="closeBtn" onclick="closeBirthdayModal()">×</button>
  <div style="text-align: center; margin-top: 20px; font-size: 14px;">
    <div id="bdInputArea">
      あなたの誕生日は？<br><br>
      <select id="bdMonth" class="bd-select" onchange="updateBirthdayDays()"></select> 月 
      <select id="bdDay" class="bd-select"></select> 日<br><br>
      <button onclick="confirmBirthday()" style="padding: 5px 15px; border: 1px solid #7fbce0; background: rgba(255,255,255,0.5); border-radius: 4px; cursor: pointer;">確認</button>
    </div>
    <div id="bdConfirmArea" style="display: none;">
      <span id="bdConfirmText" style="color: #2a6fff;"></span><br>でよろしいですか？<br><br>
      <button onclick="saveBirthday()" style="padding: 5px 15px; border: 1px solid #7fbce0; background: rgba(255,255,255,0.5); border-radius: 4px; cursor: pointer;">OK！</button>
      <button onclick="cancelBirthday()" style="padding: 5px 15px; border: 1px solid #ff7b7b; background: #fff0f0; border-radius: 4px; cursor: pointer; margin-left: 10px;">やり直す</button>
    </div>
  </div>
</div>

<div id="reminderCreateModal" class="log">
  <button class="closeBtn" onclick="closeReminderCreateModal()">×</button>
  <div style="text-align: center; margin-top: 20px;">
    <span style="font-size: 18px; color: #2a6fff; font-family: var(--font-classic); font-weight: 600;">新しいリマインダー</span><br><br>
    <input type="text" id="remTitleInput" class="rem-input" placeholder="タイトル (例: レポート提出)"><br>
    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 15px; margin-bottom: 20px;">
      <input type="date" id="remDateInput" class="rem-input" style="width: auto; padding: 6px;">
      <input type="time" id="remTimeInput" class="rem-input" style="width: auto; padding: 6px;">
    </div>
    <button onclick="saveNewReminder()" style="padding: 6px 20px; border: 1px solid #7fbce0; background: rgba(255,255,255,0.5); border-radius: 4px; cursor: pointer;">作成</button>
  </div>
</div>

<div id="musicSelectModal" class="log">
  <div style="text-align: center; margin-top: 10px;">
    <span style="font-family: var(--font-classic); font-size: 18px; color: #2a6fff; font-weight: 600;">どの曲が聴きたい？</span><br><br>
    <button onclick="playPianoEvent('song1')" class="rem-input" style="margin-bottom: 10px; cursor:pointer;">氷柱降る森の曲</button><br>
    <button onclick="playPianoEvent('song2')" class="rem-input" style="margin-bottom: 10px; cursor:pointer;">澄み渡る黎明の曲</button><br>
    <button onclick="playPianoEvent('song3')" class="rem-input" style="cursor:pointer;">思い出の夏の曲</button>
  </div>
</div>

<div id="musicRoomModal" class="log">
  <button class="closeBtn" onclick="closeMusicRoomModal()">×</button>
  <div style="text-align: center; margin-top: 10px;">
    <span style="font-family: var(--font-classic); font-size: 18px; color: #2a6fff; font-weight: 600;">音楽室</span><br><br>
    <div id="musicRoomList"></div>
    <br>
    <button onclick="stopMusic()" style="padding: 5px 15px; border: 1px solid #ff7b7b; background: rgba(255,255,255,0.5); border-radius: 4px; cursor: pointer; color: #d93030; font-family: var(--font-main);">曲を止める</button>
  </div>
</div>

<div class="app-container" id="appContainer">
  <div class="container" onclick="speak()">
    <div class="title">ひとことフブキ</div>
    <img id="img" src="fubuki.png" class="character">
    <div id="speech" class="speech">（クリックしてね）</div>
  </div>

  <div id="reminderDisplay" class="reminder-display" style="display: none;">
    <div class="rem-count" id="remCountText">1/1</div>
    <div class="rem-title" id="remTitleText">タイトル</div>
    <div class="rem-time" id="remTimeText">日時</div>
    <div class="rem-hint">長押し+下で消去 / 左右で切替</div>
  </div>
</div>

<script>
// ===== セリフ群 =====
const normalLines = [
"今日は静かね",
"市場のほうが盛り上がってるようね。ちょっと見に行ってみようかしら",
"この仕事が終わったらお茶にしましょうか",
"そういえばあの書類、そろそろ取りかからないと",
"甘いもの食べたい…",
"ツゲ、どこ行ってたの？"
];

const timeLines = {
morning: [
"おはよう、今日もいい朝ね",
"太陽の光を浴びると目が覚めるらしいわね　　…ここは日光が届かないけど…",
"忘れ物はない？",
"遅刻しないようにね",
"ツゲ起きて、朝ごはんよ"
],
noon1: [
"さて、今日も仕事しますか",
"坑道の見回りに行ってこようかな",
"ちょっとお腹が空いてきたわね…",
"今日片づける仕事はこれとあれと……",
"書類、誰か代わりに読んでくれないかしら"
],
noon2: [
"ちょっと眠いわね…",
"今日のおやつは何にしようかしら",
"午後もわりと仕事あるわね…",
"ツゲぴょん、これ手伝って～…　痛い痛い！ごめんって！",
"(ペンを持つと絵が描きたくなる…)"
],
evening: [
"今日の夜ご飯は何にしようかしら",
"これ、今日中に終わるのかな…",
"不意に屋台の食べ物が食べたくなってきたわ",
"そろそろ坑道を見に行かないと",
"(夜ご飯、ルイベじゃないといいな…)"
],
night: [
"今日も一日、お疲れ様",
"夜ご飯おいしかったわ、どこの具材使ってたんだろう",
"食後のデザートってずっと食べたくなるわよね",
"私はそろそろ寝るわ。おやすみなさい",
"(明日はあれやらないと…)"
],
midnight: [
"すやすや…(日常の夢を見ているようだ)",
"むにゃ…(仕事の夢を見ているようだ)",
"………(ぐっすり眠っているようだ)",
"…こんな時間に何をしてるの？",
"早く寝なさい、身体に障るわよ"
]
};

const rareLines = {
normal: [
"炎の魔力と轟音……　またやったわねマッヒー…",
"もう少し暇だったらバネッサまで遊びに行くんだけど",
"…みんな何してるかなぁ",
"カップラーメン食べたいなぁ",
"護王様ってあの身体でどうやって仕事してるんだろ"
],
midnight: [
"ふふふ……(いつかの旅の夢を見ているようだ)",
"うぐ…うーん……(いつかの戦いの夢を見ているようだ)",
"ぼくらだけの…せかい……(いつかの居場所の夢を見ているようだ)",
"たんい…ほしい……(いつかの学び舎の夢を見ているようだ)",
"まだ起きてるの？　…仕方ないわね、ちょっと弾いてあげるから早く寝なさいよ。何がいい？"
]
};

const eventLines = {
"1-1": ["あけましておめでとう。今年も良い一年にしましょうね"],
"1-12": ["今日は…あの人の誕生日ね。　…お団子食べたくなってきた"],
"4-1": ["今日から私、ニライカナイに引っ越すことにしたの。　…当然嘘よ"],
"5-17": ["今日は誕生日ね、ケーキでも食べようかしら。　…いや、この世界での誕生日は知らないけど…"],
"8-5": ["…今日はあの場所の……何周年なんだ…？"],
"10-31": ["トリックオアトリート！　冗談よ、お菓子いる？"],
"12-25": ["今日はクリスマス、プレゼントには時間がほしいわ。　…前の人生でもそんなこと言ってたような…"],
"12-31": ["今日は大晦日ね、充実した一年だった？　来年もよろしくね"]
};

const achievementLines = [];
  
const achievements = {
  morning: { lines: [...timeLines.morning], reward: "ふわぁ……まだ少し眠いわね", unlocked: false },

function checkLoginBonus() {
  const today = getTodayStr();
  if (dynamicAffinity.lastLoginDate !== today) {
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

    if (dynamicAffinity.lastLoginDate === yesterdayStr) {
      dynamicAffinity.consecutiveDays++;
    } else {
      dynamicAffinity.consecutiveDays = 1;
    }
    
    const addedPoints = Math.min(dynamicAffinity.consecutiveDays, 10);
    dynamicAffinity.points += addedPoints;
    dynamicAffinity.lastLoginDate = today;
    localStorage.setItem("dynamicAffinity", JSON.stringify(dynamicAffinity));
    updateAffinityUI();
  }
}

function onReminderDismissed() {
  const today = getTodayStr();
  if (dynamicAffinity.lastReminderDate !== today) {
    dynamicAffinity.todayReminderCount = 0;
    dynamicAffinity.lastReminderDate = today;
  }
  if (dynamicAffinity.todayReminderCount < 3) {
    dynamicAffinity.points += 1;
    dynamicAffinity.todayReminderCount++;
    localStorage.setItem("dynamicAffinity", JSON.stringify(dynamicAffinity));
    updateAffinityUI();
  }
}

function addRewardToPool(key, reward) {
  if (timeLines[key] && !timeLines[key].includes(reward)) {
    timeLines[key].push(reward);
  } else if (key === 'late' && !timeLines.midnight.includes(reward)) {
    timeLines.midnight.push(reward);
  } else {
    if (!normalLines.includes(reward)) normalLines.push(reward);
  }
}

function removeAllRewardsFromPools() {
  const allRewards = [];
  for (let k in achievements) allRewards.push(achievements[k].reward);
  for (let i = normalLines.length - 1; i >= 0; i--) {
    if (allRewards.includes(normalLines[i])) normalLines.splice(i, 1);
  }
  for (let tKey in timeLines) {
    for (let i = timeLines[tKey].length - 1; i >= 0; i--) {
      if (allRewards.includes(timeLines[tKey][i])) timeLines[tKey].splice(i, 1);
    }
  }
}

function initializeAchievements(targetSeen) {
  removeAllRewardsFromPools();
  achievementLines.length = 0;
  
  if (userBirthday) {
    if (!eventLines[userBirthday]) eventLines[userBirthday] = [];
    if (!eventLines[userBirthday].includes(playerBirthdayLine)) {
      eventLines[userBirthday].push(playerBirthdayLine);
    }
  }

  const allDialogueLines = [
    ...normalLines,
    ...timeLines.morning, ...timeLines.noon1, ...timeLines.noon2,
    ...timeLines.evening, ...timeLines.night, ...timeLines.midnight,
    ...Object.values(eventLines).flat(),
    ...rareLines.normal, ...rareLines.midnight
  ];
  achievements.all.lines = allDialogueLines;

  for (let key in achievements) achievements[key].unlocked = false;

  for (let key in achievements) {
    const ach = achievements[key];
    const allSeen = ach.lines.every(line => targetSeen.includes(line));

    if (allSeen) {
      ach.unlocked = true;
      if (!achievementLines.includes(ach.reward)) achievementLines.push(ach.reward);
      addRewardToPool(key, ach.reward);
    }
  }

  if (achievements.seasonal.unlocked) {
    document.getElementById("editBirthdayBtn").style.display = "inline-block";
  } else {
    document.getElementById("editBirthdayBtn").style.display = "none";
  }

    document.getElementById("musicRoomBtn").style.display = "inline-block";
  } else {
    document.getElementById("musicRoomBtn").style.display = "none";
  }

  updateAffinityUI(); 
}

let remStartX=0, remStartY=0, remCurX=0, remCurY=0;
let remDragging = false;
let remLongPressTimer = null;
let remLongPressed = false;
const remDisplay = document.getElementById("reminderDisplay");

remDisplay.addEventListener("pointerdown", (e) => {
  remDragging = true;
  remStartX = e.clientX;
  remStartY = e.clientY;
  remLongPressed = false;
  remDisplay.setPointerCapture(e.pointerId);
  remDisplay.style.transition = "none";

  remLongPressTimer = setTimeout(() => {
    if (remDragging) {
      remLongPressed = true;
      remDisplay.classList.add("rem-long-pressed");
      if (navigator.vibrate) navigator.vibrate(50);
    }
  }, 400); 
});

remDisplay.addEventListener("pointermove", (e) => {
  if (!remDragging) return;
  remCurX = e.clientX;
  remCurY = e.clientY;
  let dx = remCurX - remStartX;
  let dy = remCurY - remStartY;

  if (!remLongPressed && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
    clearTimeout(remLongPressTimer);
  }

  if (remLongPressed) {
    if (dy > 0) remDisplay.style.transform = `scale(0.95) translateY(${dy}px)`;
  } else {
    remDisplay.style.transform = `translateX(${dx}px)`;
  }
});

remDisplay.addEventListener("pointerup", endRemDrag);
remDisplay.addEventListener("pointercancel", endRemDrag);

function endRemDrag(e) {
  if (!remDragging) return;
  remDragging = false;
  clearTimeout(remLongPressTimer);
  remDisplay.classList.remove("rem-long-pressed");

  let dx = remCurX - remStartX;
  let dy = remCurY - remStartY;
  
  if (remLongPressed) {
    remDisplay.style.transition = "transform 0.3s ease, opacity 0.3s ease";
    if (dy > 50) {
      dismissCurrentReminder();
    } else {
      remDisplay.style.transform = "translate(0px, 0px)";
    }
  } else {
    if (dx > 50) {
      cycleReminder(1);
    } else if (dx < -50) {
      cycleReminder(-1);
    } else {
      remDisplay.style.transition = "transform 0.3s ease";
      remDisplay.style.transform = "translate(0px, 0px)";
    }
  }
}

function cycleReminder(dir) {
  if (activeReminders.length <= 1) {
    remDisplay.style.transition = "transform 0.3s ease";
    remDisplay.style.transform = "translate(0px, 0px)";
    return;
  }
  
  const exitX = dir > 0 ? 300 : -300;
  const enterX = dir > 0 ? -300 : 300;

  remDisplay.style.transition = "transform 0.2s ease, opacity 0.2s ease";
  remDisplay.style.transform = `translateX(${exitX}px)`;
  remDisplay.style.opacity = "0";

  setTimeout(() => {
    currentRemIndex = (currentRemIndex + dir + activeReminders.length) % activeReminders.length;
    updateReminderContent();

    remDisplay.style.transition = "none";
    remDisplay.style.transform = `translateX(${enterX}px)`;
    void remDisplay.offsetWidth;

    remDisplay.style.transition = "transform 0.3s ease, opacity 0.3s ease";
    remDisplay.style.transform = "translate(0px, 0px)";
    remDisplay.style.opacity = "1";
  }, 200);
}

function dismissCurrentReminder() {
  const rem = activeReminders[currentRemIndex];
  rem.isDismissed = true;
  saveReminders();
  
  onReminderDismissed();
  
  remDisplay.style.transform = "scale(0.8) translateY(100px)";
  remDisplay.style.opacity = "0";
  
  setTimeout(() => {
    remDisplay.style.transform = "translate(0px, 0px)";
    remDisplay.style.opacity = "1";
    checkActiveReminders();
  }, 300);
}

  for(let i=1; i<=12; i++) mSel.innerHTML += `<option value="${i}">${i}</option>`;
  updateBirthdayDays();
  
  if (userBirthday) {
    const [m, d] = userBirthday.split('-');
    document.getElementById("bdMonth").value = m;
    updateBirthdayDays();
    document.getElementById("bdDay").value = d;
  }

  document.getElementById("bdInputArea").style.display = "block";
  document.getElementById("bdConfirmArea").style.display = "none";
  
  const modal = document.getElementById("birthdayModal");
  document.getElementById("overlay").style.display = "block";
  modal.style.display = "block";
  setTimeout(() => {
    document.getElementById("overlay").classList.add("show");
    modal.classList.add("show");
  }, 10);
}

function updateBirthdayDays() {
  const m = parseInt(document.getElementById("bdMonth").value) || 1;
  const dSel = document.getElementById("bdDay");
  const daysInMonth = new Date(2024, m, 0).getDate(); 
  let currentDay = dSel.value;
  
  dSel.innerHTML = "";
  for(let i=1; i<=daysInMonth; i++) dSel.innerHTML += `<option value="${i}">${i}</option>`;
  if (currentDay && currentDay <= daysInMonth) dSel.value = currentDay;
}

function closeBirthdayModal() {
  const modal = document.getElementById("birthdayModal");
  modal.classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
  setTimeout(() => {
    modal.style.display = "none";
    document.getElementById("overlay").style.display = "none";
  }, 200);
}

function confirmBirthday() {
  const m = document.getElementById("bdMonth").value;
  const d = document.getElementById("bdDay").value;
  document.getElementById("bdConfirmText").textContent = `${m}月${d}日`;
  document.getElementById("bdInputArea").style.display = "none";
  document.getElementById("bdConfirmArea").style.display = "block";
}

function cancelBirthday() {
  document.getElementById("bdConfirmArea").style.display = "none";
  document.getElementById("bdInputArea").style.display = "block";
}

function saveBirthday() {
  const m = document.getElementById("bdMonth").value;
  const d = document.getElementById("bdDay").value;
  const newBirthday = `${m}-${d}`;

  if (userBirthday && eventLines[userBirthday]) {
    eventLines[userBirthday] = eventLines[userBirthday].filter(line => line !== playerBirthdayLine);
    if (eventLines[userBirthday].length === 0) delete eventLines[userBirthday];
  }

  userBirthday = newBirthday;
  localStorage.setItem("userBirthday", userBirthday);

  if (!eventLines[userBirthday]) eventLines[userBirthday] = [];
  if (!eventLines[userBirthday].includes(playerBirthdayLine)) {
    eventLines[userBirthday].push(playerBirthdayLine);
  }

  closeBirthdayModal();
  document.getElementById("editBirthdayBtn").style.display = "inline-block";
  setTimeout(() => { showLine(`${m}月${d}日ね。覚えておくわ`, true); }, 300);
}

function handleDebugToggle(checkbox) {
  if (checkbox.checked) {
    checkbox.checked = false; 
    document.getElementById("overlay").style.display = "block";
    setTimeout(() => document.getElementById("overlay").classList.add("show"), 10);
    const modal = document.getElementById("passwordModal");
    modal.style.display = "block";
    setTimeout(() => modal.classList.add("show"), 10);
  } else {
    isDebugMode = false;
    debugSeen = [];
    debugUnlockedSongs = []; 
    document.getElementById("debugMenu").style.display = "none";
    alert("デバッグモードを終了しました。履歴は通常モードに戻ります。");
    initializeAchievements(seen);
    updateBackground();
    updateAffinityUI();
  }
}

function closePasswordModal() {
  const modal = document.getElementById("passwordModal");
  modal.classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
  setTimeout(() => {
    modal.style.display = "none";
    document.getElementById("overlay").style.display = "none";
  }, 200);
}

function checkPassword() {
  if (document.getElementById("debugPassword").value === debugPassword) {
    isDebugMode = true;
    debugSeen = []; 
    debugUnlockedSongs = [];
    initializeAchievements(debugSeen);
    document.getElementById("debugToggle").checked = true;
    document.getElementById("debugPassword").value = "";
    document.getElementById("debugMenu").style.display = "flex";
    closePasswordModal();
    updateBackground();
    updateAffinityUI();
    alert("デバッグモードを開始しました。");
  } else {
    alert("パスワードが違います。");
  }
}

function resetNormalHistory() {
  if (confirm("通常モードの履歴を完全に削除します。よろしいですか？")) {
    localStorage.removeItem("seen");
    seen = [];
    if (!isDebugMode) {
      initializeAchievements(seen);
      updateAffinityUI();
    }
    alert("通常モードの履歴をリセットしました。");
  }
}

function saveSeen(text){
  const cleanText = text.replace("✨ ", "");
  if (isDebugMode) {
    if(!debugSeen.includes(cleanText)) debugSeen.push(cleanText);
  } else {
    if(!seen.includes(cleanText)){
      seen.push(cleanText);
      localStorage.setItem("seen", JSON.stringify(seen));
    }
  }
}

function toggleLog() {
  const log = document.getElementById("log");
  const overlay = document.getElementById("overlay");
  if (log.classList.contains("show")) {
    log.classList.remove("show");
    overlay.classList.remove("show");
    setTimeout(() => { log.style.display = "none"; overlay.style.display = "none"; }, 200);
  } else {
    renderLog();
    log.style.display = "block";
    overlay.style.display = "block";
    setTimeout(() => { log.classList.add("show"); overlay.classList.add("show"); }, 10);
  }
}

function renderLog() {
  const logList = document.getElementById("logList");
  logList.innerHTML = "";
  const currentSeen = isDebugMode ? debugSeen : seen;
  const allRewards = [];
  for (let key in achievements) allRewards.push(achievements[key].reward);

  const eventLineValues = Object.values(eventLines).flat();
  const sections = [
    ["通常", normalLines],
    ["朝", timeLines.morning], ["昼1", timeLines.noon1], ["昼2", timeLines.noon2],
    ["夕方", timeLines.evening], ["夜", timeLines.night], ["深夜", timeLines.midnight],
    ["季節", eventLineValues],
    ["レア", [...rareLines.normal, ...rareLines.midnight]],
    ["アチーブメント", achievementLines]
  ];

  sections.forEach(([name, arr]) => {
    logList.innerHTML += `<b style="font-family: var(--font-classic); color: #2a6fff;">${name}</b><br>`;
    arr.forEach(text => {
      if (name !== "アチーブメント" && allRewards.includes(text)) return; 
      logList.innerHTML += currentSeen.includes(text) ? text : "？？？";
      logList.innerHTML += "<br>";
    });
    logList.innerHTML += "<br>";
  });
}

function getZone(hour){
  if(hour>=5 && hour<9) return "morning";
  if(hour<12) return "noon1";
  if(hour<16) return "noon2";
  if(hour<18) return "evening";
  if(hour<21) return "night";
  return "midnight";
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ===== 音楽再生関連 =====

  const modal = document.getElementById("musicSelectModal");
  document.getElementById("overlay").style.display = "block";
  modal.style.display = "block";
  setTimeout(() => {
    document.getElementById("overlay").classList.add("show");
    modal.classList.add("show");
  }, 10);
}

function closeMusicSelectModal() {

  document.getElementById("overlay").classList.remove("show");
  setTimeout(() => {
    modal.style.display = "none";
    document.getElementById("overlay").style.display = "none";
  }, 200);
}

function playPianoEvent(songKey) {
  closeMusicSelectModal();
  
  if (isDebugMode) {
    if (!debugUnlockedSongs.includes(songKey)) {
      debugUnlockedSongs.push(songKey);
      document.getElementById("musicRoomBtn").style.display = "inline-block";
    }
  } else {
    if (!unlockedSongs.includes(songKey)) {
      unlockedSongs.push(songKey);
      localStorage.setItem("unlockedSongs", JSON.stringify(unlockedSongs));
      document.getElementById("musicRoomBtn").style.display = "inline-block";
    }
  }

  showLine("(ピアノを弾いている…)", false, true);
  isPlayingMusic = true;

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  currentAudio = new Audio(musicData[songKey].file);
  currentAudio.play().catch(e => {
    alert("音声ファイルの再生に失敗しました。ファイル名を確認してください。");
    isPlayingMusic = false;
  });

  currentAudio.onended = function() {
    isPlayingMusic = false;
  };
}

function openMusicRoomModal() {

  const currentSongs = isDebugMode ? debugUnlockedSongs : unlockedSongs;

    btn.className = "rem-input";
    btn.style.marginBottom = "10px";

  }, 10);
}

function closeMusicRoomModal() {
  const modal = document.getElementById("musicRoomModal");
  modal.classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
  setTimeout(() => {
    modal.style.display = "none";
    document.getElementById("overlay").style.display = "none";
  }, 200);
}

function playMusicRoom(songKey) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  currentAudio = new Audio(musicData[songKey].file);
  currentAudio.play();
}

function stopMusic() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
}


function speak(){
  if (isPlayingMusic) return;

  updateBackground();

  if (waitingForBirthdayClick) {
    waitingForBirthdayClick = false;
    openBirthdayModal();
    return;
  }

  if (waitingForMusicClick) {
    waitingForMusicClick = false;
    openMusicSelectModal();
    return;
  }
  
  const now = new Date();
  const currentHour = now.getHours();

  if (!isDebugMode && currentHour === tsugeHour) {
    pendingNGReaction = null;
    checkLoginBonus(); 
    
    const nowTime = Date.now();
    if (nowTime - tsugeLastClickTime > 60000) {
      tsugeClickCount = 0;
    }
    tsugeLastClickTime = nowTime;

    const pendingRems = allReminders.filter(r => !r.isDismissed);
    if (pendingRems.length > 0 && Math.random() < 0.15) {
      const randomRem = pick(pendingRems);
      const line = `…${randomRem.title}、早くやれよ`;
      showLine(line, false, true, "tsuge.png");
      return;
    }

    const nextHour = (tsugeHour + 1) % 24;
    const tsugeLines = [
      "フブキなら今席を外している",
      "そんなに遠くには行ってないはずだ",
      `${nextHour}時には帰ってくるんじゃないか？`,
      "……",
      "暇なのかニンゲン",
      "話題などないぞ",
      "…そういえば昨日、…　…何も思いつかない",
      "………",
      "…己の成すべきことを成せ",
      "…もう喋らないからな"
    ];
    
    let line = "";
    if (tsugeClickCount < tsugeLines.length) {
      line = tsugeLines[tsugeClickCount];
    } else {
      const loopIdx = (tsugeClickCount - 7) % 3 + 7;
      line = tsugeLines[loopIdx];
    }
    tsugeClickCount++;
    
    showLine(line, false, true, "tsuge.png");
    return;
  }
  
  if (pendingRewards.length > 0) {
    showLine(pendingRewards.shift(), true);
    return;
  }

  if (pendingNGReaction) {
    let line = "";
    if (pendingNGReaction.type === 1) {
      line = `${pendingNGReaction.word}って言った？`; 
    } else {
      line = `…${pendingNGReaction.word}って言った？`;
    }
    pendingNGReaction = null;
    showLine(line, false, true);
    return;
  }

  checkLoginBonus();
  const totalAff = getTotalAffinity();
  const todayStr = getTodayStr();

  if (totalAff >= 50 && todayGreetedDate !== todayStr && !isDebugMode) {
    todayGreetedDate = todayStr;
    localStorage.setItem("todayGreetedDate", todayGreetedDate);
    const zone = getZone(currentHour);
    showLine(lv1Greetings[zone], false, true); 
    return;
  }

  let line;
  let isRare = false;

  const pendingRems = allReminders.filter(r => !r.isDismissed);
  if (!isDebugMode && pendingRems.length > 0 && Math.random() < 0.15) {
    const randomRem = pick(pendingRems);
    line = `${randomRem.title}は大丈夫なの？`;
    showLine(line, false, true);
    return;
  }

  if (isDebugMode) {
    const condition = document.getElementById("debugCondition").value;
    let pool = [];
    switch (condition) {
      case "all":
        pool = [...normalLines, ...Object.values(timeLines).flat(), ...Object.values(eventLines).flat(), ...rareLines.normal, ...rareLines.midnight];
        line = pick(pool);
        isRare = rareLines.normal.includes(line) || rareLines.midnight.includes(line);
        break;
      case "morning": case "noon1": case "noon2": case "evening": case "night": case "midnight":
        pool = [...timeLines[condition]];
        line = pick(pool);
        break;
      case "seasonal":
        pool = [...Object.values(eventLines).flat()];
        if (achievements.seasonal.unlocked && !pool.includes(achievements.seasonal.reward)) pool.push(achievements.seasonal.reward);
        line = pick(pool);
        break;
      case "rare_normal":
        pool = [...rareLines.normal];
        if (achievements.rare.unlocked && !pool.includes(achievements.rare.reward)) pool.push(achievements.rare.reward);
        line = pick(pool);
        isRare = true;
        break;
      case "rare_midnight":
        pool = [...rareLines.midnight];
        line = pick(pool);
        isRare = true;
        break;
    }
    showLine(line, isRare);
    return;
  }

  const zone = getZone(currentHour);
  const key = (now.getMonth()+1)+"-"+now.getDate();

  if(eventLines[key] && Math.random()<0.3){
    showLine(pick(eventLines[key]), false);
    return;
  }

  let rareChance = 0.01;
  if (totalAff >= 1000) rareChance = 0.05;
  else if (totalAff >= 300) rareChance = 0.03;

  if(Math.random() < rareChance){
    line = (zone==="midnight") ? pick(rareLines.midnight) : pick(rareLines.normal);
    showLine(line, true);
    return;
  }

  if (totalAff >= 3000 && Math.random() < 0.05) {
     line = (zone==="midnight") ? pick(lvMaxLinesMidnight) : pick(lvMaxLinesNormal);
     showLine(line, false, true);
     return;
  }

  if(zone==="midnight"){
    line = pick(timeLines.midnight);
  } else {
    let currentNormal = [...normalLines];
    if (totalAff >= 300) {
      currentNormal = currentNormal.concat(lv2NormalLines);
    }
    line = Math.random()<0.6 ? pick(timeLines[zone]) : pick(currentNormal);
  }
  showLine(line, false);
}

function showLine(text, isRare, isDynamic = false, forcedImage = null){
  if (!isDynamic) saveSeen(text);
  const el = document.getElementById("speech");
  el.style.color = isRare ? "#2a6fff" : "#333";
  
  if (forcedImage) {
    document.getElementById("img").src = forcedImage;
  } else {
    document.getElementById("img").src = getFaceImage(text);
  }
  
  typeText(text, isDynamic);
}

function typeText(text, isDynamic = false) {
  if (typing) return;
  typing = true;
  const el = document.getElementById("speech");
  el.textContent = "";

  let i = 0;
  function step() {
    if (i < text.length) {
      el.textContent += text[i];
      i++;
      setTimeout(step, 25);
    } else {
      typing = false;
      if (text.includes(achievements.seasonal.reward)) {
        waitingForBirthdayClick = true;
        document.getElementById("editBirthdayBtn").style.display = "inline-block";
      }
      
      if (text.includes("ちょっと弾いてあげるから早く寝なさいよ。何がいい？")) {
        waitingForMusicClick = true;
      }

      if (!isDynamic) {
        checkAchievements();
        updateAffinityUI(); 
      }
    }
  }
  step();
}

function checkAchievements() {
  const currentSeen = isDebugMode ? debugSeen : seen;

  for (let key in achievements) {
    const ach = achievements[key];
    if (ach.unlocked || key === "all") continue;

    const allSeen = ach.lines.every(line => currentSeen.includes(line));
    if (allSeen) {
      ach.unlocked = true;
      pendingRewards.push("✨ " + ach.reward);
      if (!achievementLines.includes(ach.reward)) achievementLines.push(ach.reward);
      addRewardToPool(key, ach.reward);
      if (key === "seasonal") document.getElementById("editBirthdayBtn").style.display = "inline-block";
    }
  }

  if (!achievements.all.unlocked) {
    const allLines = achievements.all.lines;
    const allSeen = allLines.every(line => currentSeen.includes(line));
    if (allSeen && allLines.length > 0) {
      achievements.all.unlocked = true;
      pendingRewards.push("✨ " + achievements.all.reward);
      if (!achievementLines.includes(achievements.all.reward)) achievementLines.push(achievements.all.reward);
      addRewardToPool("all", achievements.all.reward);
    }
  }
}

document.getElementById("overlay").onclick = function(e) {
  if (e.target.id === "overlay") {
    if (document.getElementById("musicSelectModal").classList.contains("show")) {
      return; 
    }
    
    if (document.getElementById("passwordModal").classList.contains("show")) {
      closePasswordModal();
    } else if (document.getElementById("birthdayModal").classList.contains("show")) {
      closeBirthdayModal();
    } else if (document.getElementById("reminderCreateModal").classList.contains("show")) {
      closeReminderCreateModal();
    } else if (document.getElementById("musicRoomModal").classList.contains("show")) {
      closeMusicRoomModal();
    } else {
      toggleLog();
    }
  }
};
